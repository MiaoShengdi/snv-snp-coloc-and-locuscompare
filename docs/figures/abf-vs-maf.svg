<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <title>同一个 z 值下 lABF 随 MAF 衰减</title>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#0f172a">同一个 z = 8、N = 5000，MAF 越低 lABF 越低</text>
  <text x="20" y="50" font-size="12" fill="#64748b">lABF = 0.5·[log(1−r) + r·z²]，r = w/(w+V)，V = 1/(2Nf(1−f))，w = 0.15²</text>

  <line x1="60" y1="262" x2="610" y2="262" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="100" y="80" width="70" height="182" fill="#4f7ca8"/>
  <rect x="220" y="88" width="70" height="174" fill="#4f7ca8"/>
  <rect x="340" y="129" width="70" height="133" fill="#4f7ca8"/>
  <rect x="460" y="226" width="70" height="36" fill="#c4623f"/>

  <text x="135" y="70" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">29.4</text>
  <text x="255" y="78" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">28.0</text>
  <text x="375" y="119" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">21.5</text>
  <text x="495" y="216" font-size="13" font-weight="700" fill="#b42318" text-anchor="middle">5.8</text>

  <text x="135" y="282" font-size="12.5" fill="#475569" text-anchor="middle">MAF 0.30</text>
  <text x="255" y="282" font-size="12.5" fill="#475569" text-anchor="middle">0.05</text>
  <text x="375" y="282" font-size="12.5" fill="#475569" text-anchor="middle">0.01</text>
  <text x="495" y="282" font-size="12.5" fill="#475569" text-anchor="middle">0.001</text>

  <text x="20" y="272" font-size="12" fill="#64748b" transform="rotate(-90 20 272)" text-anchor="middle">lABF</text>

  <text x="100" y="310" font-size="13" fill="#0f172a">0.30 → 0.001：lABF 差 23.6，即 BF 差 e²³·⁶ ≈ 1.8×10¹⁰</text>
  <text x="100" y="326" font-size="12" fill="#64748b">结论：罕见 SNV 不是「算不出」，而是进不了 H4 的分子</text>
</svg>
